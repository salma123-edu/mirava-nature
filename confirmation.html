<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande Confirmée - MIRAVA NATURE</title>
    <link rel="stylesheet" href="css/style.css?v=4.0" />
</head>

<body>
    <header>
        <div class="container">
            <a href="index.html">
                <img src="images/logo.png" alt="Logo Mirava Nature" />
            </a>
            <button class="mobile-menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="products.html">Produits</a>
                <a href="kits.html">Coffrets</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="confirmation-container">
            <div class="success-icon">✓</div>
            <h1>Merci pour votre commande !</h1>
            <p>Votre demande a été enregistrée avec succès. Notre équipe vous contactera très bientôt pour confirmer les
                détails de la livraison.</p>

            <div class="order-id">PRÉPARATION EN COURS 🌿</div>

            <div>
                <a href="index.html" class="btn-premium">Retour à l'accueil</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 MIRAVA NATURE</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // Vider le panier après confirmation au cas où ce n'est pas fait (par sécurité)
        localStorage.removeItem('cart');

        // Extraire l'ID de la commande de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        const orderIdDisplay = document.querySelector('.order-id');

        if (orderId) {
            orderIdDisplay.innerHTML = `COMMANDE : <strong>${orderId}</strong> 🌿`;
        } else {
            orderIdDisplay.innerHTML = `PRÉPARATION EN COURS 🌿`;
        }
    </script>
</body>

</html>
