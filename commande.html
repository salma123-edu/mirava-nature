<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finaliser la commande - MIRAVA NATURE</title>
  <link rel="stylesheet" href="css/style.css?v=4.0">
</head>

<body>
  <header>
    <div class="container">
      <a href="index.html"><img src="images/logo.png" alt="Logo Mirava Nature" /></a>
      <button class="mobile-menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="products.html">Produits</a>
        <a href="kits.html">Coffrets</a>
        <a href="contact.html">Contact</a>
        <div id="auth-nav-area"></div>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="checkout-layout">
      <div class="checkout-main">
        <section class="checkout-section">
          <h2>Finaliser la commande</h2>
          <h3>Résumé du panier</h3>
          <div id="items-list"></div>
          <div class="summary-row">
            <div>Sous-total</div>
            <div id="subtotal">0 DH</div>
          </div>

          <h3>Frais de livraison</h3>
          <div id="shipping-area">
            <div id="shipping-automatic" class="muted" style="display:none;">Frais de livraison : <strong
                id="shipping-amount">0 DH</strong></div>

            <div id="shipping-choices" style="display:none;">
              <div class="shipping-options">
                <label><input type="radio" name="shipping" value="30" /> Hors Rabat — 30 DH</label>
                <label><input type="radio" name="shipping" value="20" /> Sur Rabat — 20 DH</label>
              </div>
              <div class="muted">Choisissez votre zone pour calculer les frais.</div>
            </div>
          </div>
        </section>

        <section class="checkout-section">
          <h3>Vos informations</h3>
          <div class="form-group"><label>Nom complet</label><input id="cust-name" type="text"
              placeholder="Salma El ..." /></div>
          <div class="form-group"><label>Email</label><input id="cust-email" type="email"
              placeholder="votre@email.com" /></div>
          <div class="form-group"><label>Téléphone</label><input id="cust-phone" type="text" placeholder="06..." />
          </div>
          <div class="form-group"><label>Adresse de livraison</label><textarea id="cust-address" rows="3"
              placeholder="Votre adresse complète"></textarea></div>
        </section>
      </div>

      <aside class="summary-card">
        <h3>Total à payer</h3>
        <div class="summary-row total">
          <div id="grand-total" style="font-size: 2rem;">0 DH</div>
        </div>
        <div style="margin-top:25px;">
          <button id="confirm-order" class="btn-premium" style="width:100%;">Confirmer la commande</button>
        </div>
        <p class="muted" style="margin-top:15px; text-align:center;">Paiement à la livraison 🚚</p>
      </aside>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 MIRAVA NATURE</p>
    </div>
  </footer>

  <script src="products-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/whatsapp-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const itemsList = document.getElementById('items-list');
      const subtotalEl = document.getElementById('subtotal');
      const shippingArea = document.getElementById('shipping-area');
      const shippingAutomatic = document.getElementById('shipping-automatic');
      const shippingChoices = document.getElementById('shipping-choices');
      const shippingAmountEl = document.getElementById('shipping-amount');
      const grandTotalEl = document.getElementById('grand-total');

      function format(d) { return d + ' DH'; }

      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (cart.length === 0) {
        itemsList.innerHTML = '<p>Votre panier est vide.</p>';
        subtotalEl.textContent = '';
        shippingAutomatic.style.display = 'none';
        shippingChoices.style.display = 'none';
        grandTotalEl.textContent = '0 DH';
        return;
      }

      // Pré-remplir les infos si connecté
      if (window.auth && window.auth.isLoggedIn()) {
        const user = window.auth.getUser();
        document.getElementById('cust-name').value = user.name || '';
        document.getElementById('cust-email').value = user.email || '';
      } else {
        // Si pas connecté sur cette page, rediriger
        alert("Veuillez vous connecter pour voir cette page.");
        window.location.href = "login.html?redirect=commande.html";
        return;
      }

      // afficher items
      let subtotal = 0;
      itemsList.innerHTML = '';
      cart.forEach(it => {
        const row = document.createElement('div');
        row.className = 'summary-row';
        row.innerHTML = `<div>${it.name} × ${it.qty}</div><div>${(it.price * it.qty)} DH</div>`;
        itemsList.appendChild(row);
        subtotal += (it.price || 0) * (it.qty || 0);
      });
      subtotalEl.textContent = format(subtotal);

      const threshold = 500;
      if (subtotal >= threshold) {
        // livraison gratuite
        shippingAutomatic.style.display = 'block';
        shippingChoices.style.display = 'none';
        shippingAmountEl.textContent = '0 DH';
        updateGrandTotal(0);
      } else {
        // proposer choix
        shippingAutomatic.style.display = 'none';
        shippingChoices.style.display = 'block';
        // préférer Hors Rabat par défaut (30)
        const radios = document.getElementsByName('shipping');
        radios.forEach(r => r.checked = false);
        radios[0].checked = true;
        updateShippingFromChoice();
        radios.forEach(r => r.addEventListener('change', updateShippingFromChoice));
      }

      function updateShippingFromChoice() {
        const radios = document.getElementsByName('shipping');
        let fee = 0;
        for (const r of radios) { if (r.checked) { fee = parseFloat(r.value); break; } }
        shippingAmountEl.textContent = format(fee);
        updateGrandTotal(fee);
      }

      function updateGrandTotal(shippingFee) {
        const gt = subtotal + (shippingFee || 0);
        grandTotalEl.textContent = format(gt);
      }

      // Confirmer la commande via WhatsApp
      document.getElementById('confirm-order').addEventListener('click', async () => {
        const nom = document.getElementById('cust-name').value.trim();
        const email = document.getElementById('cust-email').value.trim();
        const phone = document.getElementById('cust-phone').value.trim();
        const adresse = document.getElementById('cust-address').value.trim();

        if (!nom || !email || !phone || !adresse) {
          alert('Veuillez remplir tous les champs.');
          return;
        }

        // Vérifier que WhatsApp est configuré
        if (!window.WHATSAPP_CONFIG ||
          window.WHATSAPP_CONFIG.businessNumber === 'YOUR_WHATSAPP_NUMBER') {
          alert('⚠️ WhatsApp n\'est pas encore configuré.\n\nVeuillez mettre à jour votre numéro WhatsApp dans js/whatsapp-config.js');
          console.error('WhatsApp configuration is missing. Please update js/whatsapp-config.js');
          return;
        }

        // Calculer les frais de livraison
        let shippingFee = 0;
        if (subtotal >= threshold) {
          shippingFee = 0;
        } else {
          const sel = document.querySelector('input[name="shipping"]:checked');
          shippingFee = sel ? parseFloat(sel.value) : 30;
        }

        const total = subtotal + shippingFee;

        // Générer un ID de commande unique
        const orderId = 'MN-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5).toUpperCase();

        // Formater la date
        const orderDate = new Date().toLocaleString('fr-FR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        // Formater la liste des produits pour WhatsApp
        let productsList = '';
        cart.forEach(item => {
          const itemTotal = (item.price * item.qty).toFixed(2);
          productsList += `• ${item.name}\n  Qté: ${item.qty} × ${item.price} DH = ${itemTotal} DH\n`;
        });

        // Créer le message WhatsApp
        const whatsappMessage = `🛍️ *NOUVELLE COMMANDE - MIRAVA NATURE*

━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📋 *INFORMATIONS CLIENT*
━━━━━━━━━━━━━━━━━━━━━━━━━━━━

👤 Nom: ${nom}
📧 Email: ${email}
📱 Téléphone: ${phone}
📍 Adresse: ${adresse}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🛒 *DÉTAILS DE LA COMMANDE*
━━━━━━━━━━━━━━━━━━━━━━━━━━━━

${productsList}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━
💰 *TOTAUX*
━━━━━━━━━━━━━━━━━━━━━━━━━━━━

Sous-total: ${subtotal.toFixed(2)} DH
Frais de livraison: ${shippingFee.toFixed(2)} DH
─────────────────────────────
*TOTAL: ${total.toFixed(2)} DH*

💳 Mode de paiement: Paiement à la livraison 🚚

━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🆔 ID Commande: ${orderId}
📅 Date: ${orderDate}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;

        // Encoder le message pour l'URL
        const encodedMessage = encodeURIComponent(whatsappMessage);

        // Créer l'URL WhatsApp
        const whatsappNumber = window.WHATSAPP_CONFIG.businessNumber;
        const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

        console.log('📱 WhatsApp URL générée:', whatsappURL);
        console.log('📱 Numéro WhatsApp:', whatsappNumber);
        console.log('🔗 URL complète:', whatsappURL.substring(0, 150) + '...');

        // Vider le panier AVANT d'ouvrir WhatsApp
        localStorage.removeItem('cart');
        if (typeof window.updateCartUI === 'function') window.updateCartUI();
        console.log('✅ Panier vidé');

        // Créer une popup visuelle AVANT d'ouvrir WhatsApp
        const popup = document.createElement('div');
        popup.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:99999;display:flex;align-items:center;justify-content:center;';
        popup.innerHTML = `
          <div style="background:white;padding:40px;border-radius:20px;max-width:500px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
            <div style="font-size:60px;margin-bottom:20px;">📱</div>
            <h2 style="color:#25D366;margin-bottom:15px;">Commande Préparée !</h2>
            <p style="margin-bottom:25px;font-size:16px;line-height:1.6;">
              WhatsApp va s'ouvrir dans un instant avec votre commande pré-remplie.<br>
              <strong>Cliquez sur "Envoyer"</strong> dans WhatsApp pour finaliser.
            </p>
            <div style="background:#f0f9ff;padding:15px;border-radius:10px;margin-bottom:20px;">
              <strong style="color:#25D366;">ID Commande:</strong><br>
              <span style="font-family:monospace;font-size:18px;">${orderId}</span>
            </div>
            <a href="${whatsappURL}" target="_blank" id="whatsapp-link" style="display:inline-block;background:#25D366;color:white;padding:15px 40px;border-radius:10px;text-decoration:none;font-weight:bold;font-size:18px;margin-bottom:15px;">
              📱 Ouvrir WhatsApp
            </a>
            <p style="font-size:12px;color:#666;margin-top:15px;">
              Si WhatsApp ne s'ouvre pas automatiquement, cliquez sur le bouton ci-dessus
            </p>
          </div>
        `;
        document.body.appendChild(popup);

        // Ouvrir WhatsApp automatiquement après un court délai
        setTimeout(() => {
          console.log('🚀 Tentative d\'ouverture de WhatsApp...');

          try {
            const whatsappWindow = window.open(whatsappURL, '_blank');

            if (!whatsappWindow || whatsappWindow.closed || typeof whatsappWindow.closed === 'undefined') {
              console.warn('⚠️ Pop-up bloqué par le navigateur');
              // Le bouton manuel est déjà affiché dans la popup
            } else {
              console.log('✅ WhatsApp ouvert avec succès!');
            }
          } catch (error) {
            console.error('❌ Erreur:', error);
            // Le bouton manuel est déjà affiché dans la popup
          }
        }, 500);

        // Rediriger vers la page de confirmation après 5 secondes
        setTimeout(() => {
          console.log('🔄 Redirection vers la page de confirmation...');
          location.href = `confirmation.html?id=${orderId}`;
        }, 5000);
      });
    });
  </script>
</body>

</html>
